<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retórica</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado / Barra Superior -->
    <header class="app-header">
        <button id="btn-menu-hamb" class="icon-btn">☰</button>
        <h1 class="app-title">Retórica</h1>
        <button id="btn-publish" class="btn-publish">Publicar</button>
    </header>

    <!-- Botonera Principal Deslicable -->
    <nav class="toolbar-scroll" id="main-toolbar">
        <!-- Los botones redondos se inyectan dinámicamente vía JS -->
    </nav>

    <!-- Barra de Herramientas WYSIWYG (Edición de Texto) -->
    <div class="wysiwyg-toolbar" id="wysiwyg-tools">
        <button onclick="DocEditor.execCmd('bold')"><b>B</b></button>
        <button onclick="DocEditor.execCmd('italic')"><i>I</i></button>
        <button onclick="DocEditor.execCmd('underline')"><u>U</u></button>
        <button onclick="DocEditor.insertTable(2, 2)">Tabla</button>
        <label class="btn-file-label">
            Imagen
            <input type="file" accept="image/*" onchange="DocEditor.insertImageFromLocal(event)" style="display:none;">
        </label>
    </div>

    <!-- Lienzo de Edición / Trabajo -->
    <main class="editor-container">
        <div id="editor" class="editor-workspace" placeholder="Escribe o dicta tu documento aquí..."></div>
    </main>

    <!-- Sección de Biblioteca de Plantillas -->
    <section class="library-section">
        <h3>Mis Plantillas</h3>
        <div id="library-grid" class="library-grid">
            <!-- Tarjetas de documentos -->
        </div>
    </section>

    <!-- Scripts del Proyecto -->
    <script src="ui-core.js"></script>
    <script src="storage.js"></script>
    <script src="audio-engine.js"></script>
    <script src="doc-editor.js"></script>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
</body>
</html>
